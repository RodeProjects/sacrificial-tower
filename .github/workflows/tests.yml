name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      github_hosted:
        description: Unabhängige vollständige Releaseprüfung auf GitHub-Hardware
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Erwarteter unveränderter Release-Commit für gesteuerte Prüfläufe
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  classify:
    # Manual runs always execute the full suite; ordinary jobs use local hardware.
    if: ${{ github.event_name != 'workflow_dispatch' && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:hosted-release') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, rodeprojects-local]
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    outputs:
      full-tests-required: ${{ steps.confirm.outputs.confirmed == 'true' && 'false' || (steps.gate.outputs.gate-files-changed == 'true' && 'true' || steps.scope.outputs.full-tests-required) }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bereits erfolgreich geprüften Commit bestätigen
        id: confirm
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $helper = if ($env:RODE_RUNNER_ROOT) { Join-Path $env:RODE_RUNNER_ROOT 'scripts/Confirm-CheckedCommit.ps1' } else { $null }
          if ($helper -and (Test-Path -LiteralPath $helper -PathType Leaf)) {
            & $helper -Repository $env:GH_REPO -Workflow tests.yml -ExpectedSha $env:HEAD_SHA -BaseSha $env:BASE_SHA -RepositoryPath $env:GITHUB_WORKSPACE
          } else {
            'confirmed=false' >> $env:GITHUB_OUTPUT
          }

      - name: Set up Python for classification
        if: steps.confirm.outputs.confirmed != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Force full tests for CI gate changes
        id: gate
        if: steps.confirm.outputs.confirmed != 'true'
        shell: pwsh
        run: |
          git diff --quiet $env:BASE_SHA $env:HEAD_SHA -- .github/workflows/tests.yml scripts/classify_ci_changes.py tests/test_ci_change_classifier.py
          if ($LASTEXITCODE -eq 0) {
            'gate-files-changed=false' >> $env:GITHUB_OUTPUT
          } elseif ($LASTEXITCODE -eq 1) {
            'gate-files-changed=true' >> $env:GITHUB_OUTPUT
          } else {
            throw 'CI-Gate-Diff konnte nicht sicher geprüft werden.'
          }
          exit 0

      - name: Classify changed content
        id: scope
        if: steps.confirm.outputs.confirmed != 'true' && steps.gate.outputs.gate-files-changed != 'true'
        run: >-
          python scripts/classify_ci_changes.py
          --base "$env:BASE_SHA"
          --head "$env:HEAD_SHA"
          --github-output "$env:GITHUB_OUTPUT"

  unittest:
    needs: classify
    if: ${{ always() && !cancelled() && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:hosted-release') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.classify.result != 'success' || needs.classify.outputs.full-tests-required != 'false') }}
    runs-on: ${{ fromJSON(inputs.github_hosted && '["windows-latest"]' || '["self-hosted","Windows","X64","rodeprojects-local"]') }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Release-Commit prüfen
        if: ${{ inputs.expected_sha != '' }}
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$' -or $env:EXPECTED_SHA -ne $env:GITHUB_SHA) {
            throw 'Release-Commit stimmt nicht mit dem ausgelösten Workflow überein.'
          }

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-windows.lock

      - name: Create clean Python environment
        shell: pwsh
        run: |
          python -m venv .ci-venv
          if ($LASTEXITCODE -ne 0) { throw 'Neue Python-Umgebung konnte nicht erstellt werden.' }
          (Join-Path $env:GITHUB_WORKSPACE '.ci-venv\Scripts') >> $env:GITHUB_PATH
          "VIRTUAL_ENV=$(Join-Path $env:GITHUB_WORKSPACE '.ci-venv')" >> $env:GITHUB_ENV
          "COOLING_TOWER_USER_DATA_ROOT=$(Join-Path $env:RUNNER_TEMP 'tower-user-data')" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-windows.lock

      - name: Native G-Code-Analyse bauen
        run: python setup_native.py build_ext --inplace

      - name: Run tests
        env:
          SACRIFICIAL_TEST_PROGRESS_FILE: ${{ runner.temp }}\sacrificial-tower-test-progress-${{ github.run_id }}.log
        run: python scripts/run_isolated_tests.py
