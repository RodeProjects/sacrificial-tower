name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected immutable project commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-check-information:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Explain owner-controlled validation
        run: echo "Own changes require independently authorized private CI and local proof verification before merge."
  unittest:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Release-Commit prüfen
        if: ${{ inputs.expected_sha != '' }}
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$' -or $env:EXPECTED_SHA -ne $env:GITHUB_SHA) {
            throw 'Release-Commit stimmt nicht mit dem ausgelösten Workflow überein.'
          }

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-windows.lock

      - name: Create clean Python environment
        shell: pwsh
        run: |
          python -m venv .ci-venv
          if ($LASTEXITCODE -ne 0) { throw 'Neue Python-Umgebung konnte nicht erstellt werden.' }
          (Join-Path $env:GITHUB_WORKSPACE '.ci-venv\Scripts') >> $env:GITHUB_PATH
          "VIRTUAL_ENV=$(Join-Path $env:GITHUB_WORKSPACE '.ci-venv')" >> $env:GITHUB_ENV
          "COOLING_TOWER_USER_DATA_ROOT=$(Join-Path $env:RUNNER_TEMP 'tower-user-data')" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-windows.lock

      - name: Native G-Code-Analyse bauen
        run: python setup_native.py build_ext --inplace

      - name: Run tests
        env:
          SACRIFICIAL_TEST_PROGRESS_FILE: ${{ runner.temp }}\sacrificial-tower-test-progress-${{ github.run_id }}.log
        run: python scripts/run_isolated_tests.py
