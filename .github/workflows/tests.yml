name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    outputs:
      full-tests-required: ${{ steps.gate.outputs.gate-files-changed == 'true' && 'true' || steps.scope.outputs.full-tests-required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Force full tests for CI gate changes
        id: gate
        shell: bash
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/tests.yml \
            scripts/classify_ci_changes.py \
            tests/test_ci_change_classifier.py; then
            echo "gate-files-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "gate-files-changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify changed content
        id: scope
        if: steps.gate.outputs.gate-files-changed != 'true'
        run: >-
          python3 scripts/classify_ci_changes.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  unittest:
    needs: classify
    if: ${{ always() && !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.full-tests-required != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-windows.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-windows.lock

      - name: Native G-Code-Analyse bauen
        run: python setup_native.py build_ext --inplace

      - name: Run tests
        run: python -m unittest discover -s tests -q
