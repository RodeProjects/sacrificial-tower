name: Windows-Prozess-Stresstests

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process-stress:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed:
          - 1729
          - 271828
          - 314159
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      COOLING_TOWER_STRESS_SEED: ${{ matrix.seed }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-windows.lock

      - name: Abhängigkeiten installieren
        run: python -m pip install --require-hashes -r requirements-windows.lock

      - name: Isolierte Prozess-Stresstests ausführen
        run: >-
          python -m unittest discover
          -s tests
          -p test_process_stress.py
          -v
