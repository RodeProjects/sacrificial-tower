name: Windows-Prozess-Stresstests

on:
  workflow_dispatch:
    inputs:
      github_hosted:
        description: Compatibility input; public workflows always use GitHub hardware
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Erwarteter unveränderter Commit für gesteuerte Prüfläufe
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process-stress:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed:
          - 1729
          - 271828
          - 314159
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      COOLING_TOWER_STRESS_SEED: ${{ matrix.seed }}
    steps:
      - name: Prüfcommit bestätigen
        if: ${{ inputs.expected_sha != '' }}
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$' -or $env:EXPECTED_SHA -ne $env:GITHUB_SHA) {
            throw 'Prüfcommit stimmt nicht mit dem ausgelösten Workflow überein.'
          }

      - name: Repository auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Python einrichten
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-windows.lock

      - name: Saubere Python-Umgebung erstellen
        shell: pwsh
        run: |
          python -m venv .ci-venv
          if ($LASTEXITCODE -ne 0) { throw 'Neue Python-Umgebung konnte nicht erstellt werden.' }
          (Join-Path $env:GITHUB_WORKSPACE '.ci-venv\Scripts') >> $env:GITHUB_PATH
          "VIRTUAL_ENV=$(Join-Path $env:GITHUB_WORKSPACE '.ci-venv')" >> $env:GITHUB_ENV
          "COOLING_TOWER_USER_DATA_ROOT=$(Join-Path $env:RUNNER_TEMP 'tower-user-data')" >> $env:GITHUB_ENV

      - name: Abhängigkeiten installieren
        run: python -m pip install --require-hashes -r requirements-windows.lock

      - name: Isolierte Prozess-Stresstests ausführen
        run: >-
          python -m unittest discover
          -s tests
          -p test_process_stress.py
          -v
