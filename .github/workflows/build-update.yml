name: Windows-Installer für Sacrificial-Tower-Update bauen

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version x.y.z
        required: true
        type: string
      release_kind:
        description: Veröffentlichungsart
        required: true
        default: development
        type: choice
        options: [free, development]
      expected_sha:
        description: Erwarteter unveränderter Projektcommit
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Exakten main-Commit prüfen
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: pwsh
        run: |
          if ($env:EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_SHA -cne $env:GITHUB_SHA -or $env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Installer nur vom erwarteten unveränderten main-Commit bauen.'
          }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Saubere Buildumgebung vorbereiten
        shell: pwsh
        run: |
          python -m venv .ci-venv
          if ($LASTEXITCODE) { throw 'Buildumgebung fehlt.' }
          (Join-Path $env:GITHUB_WORKSPACE '.ci-venv/Scripts') >> $env:GITHUB_PATH
          "COOLING_TOWER_USER_DATA_ROOT=$(Join-Path $env:RUNNER_TEMP 'tower-build-data')" >> $env:GITHUB_ENV
      - name: Abhängigkeiten und native Erweiterung bauen
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          python setup_native.py build_ext --inplace
      - name: Installer ohne Verwaltungsgeheimnisse bauen und prüfen
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: ./scripts/build_update.ps1 -Python (Get-Command python).Source -Version $env:VERSION -ReleaseKind $env:RELEASE_KIND
      - name: Unsignierten Build zur getrennten Freigabe bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: approved-build
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 7
