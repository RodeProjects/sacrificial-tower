name: "Funktion vorschlagen"
description: "Einen Funktionswunsch und seinen Nutzen erklären."
title: "[Wunsch] "
body:
  - type: markdown
    attributes:
      value: |
        Diese Meldung und Anhänge können öffentlich zugänglich sein. Bitte keine persönlichen,
        vertraulichen oder fremden geschützten Angaben veröffentlichen; auch Profilnamen,
        Dateipfade und Screenshots prüfen. Diagnosepakete sind freiwillig und werden nicht
        automatisch angehängt. Die Filterung garantiert keine vollständige Anonymität.
        Für Datenschutzanfragen und Sicherheitslücken den vertraulichen Kontakt aus den
        Datenschutzinformationen verwenden. Support erfolgt freiwillig ohne zugesicherte
        Antwortzeit oder Umsetzung. Zum Erstellen einer Meldung ist ein GitHub-Konto erforderlich.
  - type: textarea
    id: need
    attributes:
      label: "Anwendungsfall"
      description: "Welches Problem soll die Funktion lösen?"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "Vorschlag und mögliche Alternativen"
      description: "Wie könnte die gewünschte Bedienung aussehen?"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Prüfung vor Veröffentlichung
      options:
        - label: "Ich habe Text und Anhänge geprüft und keine persönlichen, vertraulichen oder unberechtigt verwendeten fremden Inhalte beigefügt. Mir ist die mögliche öffentliche Sichtbarkeit bekannt."
          required: true
